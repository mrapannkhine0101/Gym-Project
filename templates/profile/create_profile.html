{% extends 'partial/base.html' %}

{% block title %}Create Profile{% endblock %}

{% block content %}
    <h2>Create Profile</h2>
    <form method="POST" enctype="multipart/form-data" class="justify-content-center align-items-center mx-auto" style="max-width: 500px;">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <select name="username" id="username" class="form-control" required>
                {% for profile in profiles %}
                    <option value="{{ profile.user.username }}">{{ profile.user.username }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="text" class="form-control" id="phone" name="phone" required>
        </div>
        <div class="mb-3">
            <label for="age" class="form-label">Age</label>
            <input type="number" class="form-control" id="age" name="age" required> 
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address" name="address" required>
        </div>
        <div class="mb-3">
            <label for="height" class="form-label">Height (cm)</label>
            <input type="number" class="form-control" id="height" name="height" required>
        </div>
        <div class="mb-3">
            <label for="weight" class="form-label">Weight (kg)</label>
            <input type="number" class="form-control" id="weight" name="weight" required>
        </div>
        <div class="mb-3">  
            <label for="goal" class="form-label">Fitness Goal</label>
            <input type="text" class="form-control" id="goal" name="goal" required>
        </div>        
        <div class="mb-3">
            <label for="image" class="form-label">Profile Image</label>
            <input type="file" class="form-control" id="image" name="image" required>
        </div>
        <button type="submit" class="btn btn-primary">Create Profile</button>
    </form>
{% endblock %}
