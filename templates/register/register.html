<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>

    <div class="register-container">
        <div class="register-card">
            <h2>Create Account</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="form-label">Username</label>
                    <input type="text" class="form-control" name="username" placeholder="enter your name" id="">
                </div>

                <div class="mb-3">
                    <label for="label" class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="password" name="password">
                </div>

                <button type="submit" class="btn btn-primary">register</button>
                <a href="/login/" class="btn btn-secondary">Login Here</a>

            </form>
        </div>
</body>

</html>
